<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Winget Package Search social preview</title>
  <desc id="desc">A social preview image for Winget Package Search with a search interface and winget install command.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f6fff9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0066cc"/>
      <stop offset="1" stop-color="#28a745"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#17324d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M0 505 C195 438 340 580 528 515 C710 452 841 362 1200 420 L1200 630 L0 630 Z" fill="#dff2ff" opacity="0.85"/>
  <path d="M805 0 L1200 0 L1200 260 C1082 207 969 189 868 214 C792 232 743 196 759 128 C768 89 785 48 805 0 Z" fill="#dff7e8" opacity="0.95"/>

  <g transform="translate(86 82)">
    <rect x="0" y="0" width="1028" height="466" rx="34" fill="#ffffff" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="1028" height="92" rx="34" fill="#101820"/>
    <path d="M0 58 H1028 V92 H0 Z" fill="#101820"/>
    <circle cx="48" cy="46" r="10" fill="#ff5f57"/>
    <circle cx="82" cy="46" r="10" fill="#ffbd2e"/>
    <circle cx="116" cy="46" r="10" fill="#28c840"/>
    <text x="154" y="55" fill="#d8e6f3" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="24">winget-search</text>

    <g transform="translate(70 138)">
      <rect x="0" y="0" width="888" height="82" rx="20" fill="#f6f8fa" stroke="#d6dde6" stroke-width="3"/>
      <circle cx="44" cy="41" r="18" fill="none" stroke="#0066cc" stroke-width="7"/>
      <path d="M58 55 L76 73" stroke="#0066cc" stroke-width="7" stroke-linecap="round"/>
      <text x="108" y="52" fill="#212529" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="34" font-weight="700">Search Windows Package Manager packages</text>
    </g>

    <g transform="translate(70 252)">
      <rect x="0" y="0" width="428" height="98" rx="18" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
      <rect x="28" y="28" width="44" height="44" rx="10" fill="url(#accent)"/>
      <path d="M40 50 H60 M50 40 V60" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <text x="94" y="42" fill="#212529" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24" font-weight="700">Current catalog</text>
      <text x="94" y="72" fill="#6c757d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20">Daily data from microsoft/winget-pkgs</text>
    </g>

    <g transform="translate(530 252)">
      <rect x="0" y="0" width="428" height="98" rx="18" fill="#101820"/>
      <text x="28" y="42" fill="#8be9a8" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="23">winget install -e --id</text>
      <text x="28" y="72" fill="#ffffff" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="23">Microsoft.PowerToys</text>
    </g>

    <text x="70" y="416" fill="#101820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="54" font-weight="800">Winget Package Search</text>
    <text x="70" y="452" fill="#52616f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24">Find packages fast and copy exact install commands.</text>
  </g>
</svg>
